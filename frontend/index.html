<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FluidForm</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Cpath d='M13%202.8C13%202.8%205.5%2011%205.5%2016.2a7.5%207.5%200%200%200%2015%200C20.5%2011%2013%202.8%2013%202.8Z' fill='none' stroke='%231d1d1f' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // What the page kept as Super Partner, under FluidForm's names; then the saved theme, before
      // first paint so the page never flashes the wrong one.
      try { for (var i = localStorage.length - 1; i >= 0; i--) { var k = localStorage.key(i); if (k && k.indexOf("super-partner.") === 0) { var n = "fluidform." + k.slice(14); if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k)); } } } catch (e) {}
      try { var t = localStorage.getItem("fluidform.theme"); var root = document.documentElement; root.style.colorScheme = t === "dark" ? "dark" : t === "system" ? "light dark" : "light"; root.setAttribute("data-theme", t === "dark" || t === "system" ? t : "light"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src.tsx"></script>
  </body>
</html>
