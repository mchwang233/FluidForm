<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="588" viewBox="0 0 1280 588" role="img" aria-label="若水的团队：你、负责人、员工、验收者、进度检查员、诊断员、平台工程师、复盘员">
  <style>
    .bg { fill: #fbfaf8; } .frame { fill: none; stroke: #e8e6e1; }
    .card { fill: #ffffff; stroke: #e6e3de; } .card.lead { stroke: #1d1d1f; stroke-width: 1.6; }
    .ink { fill: #1d1d1f; } .muted { fill: #6e6e73; } .faint { fill: #a1a1a6; }
    .ring { fill: none; stroke: #1d1d1f; }
    .avatar { fill: #f1efea; } .avatar.lead { fill: #1d1d1f; } .glyph { fill: #3a3a3c; } .glyph.lead { fill: #ffffff; }
    .line { fill: none; stroke: #cfccc6; stroke-width: 1.3; } .dash { stroke-dasharray: 4 5; }
    .dot { fill: #cfccc6; } .ok { fill: #1f9d55; } .okline { stroke: #1f9d55; }
    .pill { fill: #fbfaf8; } .chip { fill: #f4f2ee; stroke: #e6e3de; } .chip.run { fill: #ffffff; stroke: #1d1d1f; }
    .group { fill: #f6f4f0; stroke: #ebe8e3; }
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f0f10; } .frame { stroke: #232326; }
      .card { fill: #18181a; stroke: #2a2a2e; } .card.lead { stroke: #ededed; }
      .ink { fill: #ededed; } .muted { fill: #a1a1a6; } .faint { fill: #6e6e73; }
      .ring { stroke: #ededed; }
      .avatar { fill: #26262a; } .avatar.lead { fill: #ededed; } .glyph { fill: #d1d1d6; } .glyph.lead { fill: #111113; }
      .line { stroke: #3a3a3f; } .dot { fill: #3a3a3f; } .ok { fill: #3ccb7f; } .okline { stroke: #3ccb7f; }
      .pill { fill: #0f0f10; } .chip { fill: #1d1d20; stroke: #2e2e33; } .chip.run { fill: #18181a; stroke: #ededed; }
      .group { fill: #141416; stroke: #222225; }
    }
  </style>
  <rect class="bg frame" x="0.5" y="0.5" width="1279" height="587" rx="20"/>
  <rect class="group" x="32" y="186" width="1216" height="370" rx="18"/>
  <text x="56" y="214" class="t faint" font-size="13" font-weight="500" text-anchor="start">一个任务内</text>
  <path class="line" d="M640 136 L640 214"/>
  <circle class="dot" cx="640" cy="136" r="3"/><circle class="dot" cx="640" cy="214" r="3"/>
  <text x="654" y="180" class="t faint" font-size="12.5" font-weight="400" text-anchor="start">提问 · 回答 · 确认</text>
  <path class="line dash" d="M206 152 C 206 230, 330 276, 420 276"/>
  <path class="line dash" d="M1074 152 C 1074 230, 950 276, 860 276"/>
  <text x="222" y="182" class="t faint" font-size="12.5" font-weight="400" text-anchor="start">复盘结束的任务</text>
  <text x="1058" y="182" class="t faint" font-size="12.5" font-weight="400" text-anchor="end">拉进对话 · 请求组件</text>
  <path class="line" d="M640 338 C 640 380, 200 372, 200 414"/>
  <path class="line" d="M640 338 C 640 380, 492 372, 492 414"/>
  <path class="line" d="M640 338 C 640 380, 784 372, 784 414"/>
  <path class="line" d="M640 338 C 640 380, 1076 372, 1076 414"/>
  <circle class="dot" cx="640" cy="338" r="3"/>
  <rect class="card" x="48" y="36" width="316" height="116" rx="14"/>
  <circle class="avatar" cx="84" cy="72" r="17"/>
  <text x="84" y="77.5" class="t glyph" font-size="15" font-weight="600" text-anchor="middle">盘</text>
  <text x="112" y="78" class="t ink" font-size="17" font-weight="650" text-anchor="start">复盘员</text>
  <text x="68" y="112" class="t muted" font-size="14" font-weight="400" text-anchor="start">任务结束后总结经验，把有证据的</text>
  <text x="68" y="134" class="t muted" font-size="14" font-weight="400" text-anchor="start">改进交给之后的任务或平台工程师</text>
  <rect class="card" x="482" y="44" width="316" height="92" rx="14"/>
  <circle class="avatar" cx="518" cy="80" r="17"/>
  <text x="518" y="85.5" class="t glyph" font-size="15" font-weight="600" text-anchor="middle">你</text>
  <text x="546" y="86" class="t ink" font-size="17" font-weight="650" text-anchor="start">你</text>
  <text x="502" y="120" class="t muted" font-size="14" font-weight="400" text-anchor="start">描述任务、确认预算、回答提问</text>
  <rect class="card" x="916" y="36" width="316" height="116" rx="14"/>
  <circle class="avatar" cx="952" cy="72" r="17"/>
  <text x="952" y="77.5" class="t glyph" font-size="15" font-weight="600" text-anchor="middle">工</text>
  <text x="980" y="78" class="t ink" font-size="17" font-weight="650" text-anchor="start">平台工程师</text>
  <text x="936" y="112" class="t muted" font-size="14" font-weight="400" text-anchor="start">修改若水本身：修缺陷、加组件，</text>
  <text x="936" y="134" class="t muted" font-size="14" font-weight="400" text-anchor="start">在隔离副本里改，测过才生效</text>
  <rect class="card lead" x="420" y="214" width="440" height="124" rx="14"/>
  <circle class="avatar lead" cx="456" cy="250" r="17"/>
  <text x="456" y="255.5" class="t glyph lead" font-size="15" font-weight="600" text-anchor="middle">负</text>
  <text x="484" y="256" class="t ink" font-size="19" font-weight="650" text-anchor="start">负责人</text>
  <text x="440" y="290" class="t muted" font-size="14" font-weight="400" text-anchor="start">规划任务，每次失败后决定怎么办，最后检查整体结果。</text>
  <text x="440" y="312" class="t muted" font-size="14" font-weight="400" text-anchor="start">同一个对话从规划一直保留到任务结束。</text>
  <rect class="card" x="64" y="414" width="272" height="118" rx="14"/>
  <circle class="avatar" cx="100" cy="450" r="17"/>
  <text x="100" y="455.5" class="t glyph" font-size="15" font-weight="600" text-anchor="middle">员</text>
  <text x="128" y="456" class="t ink" font-size="17" font-weight="650" text-anchor="start">员工</text>
  <text x="84" y="490" class="t muted" font-size="14" font-weight="400" text-anchor="start">在沙箱里用工具完成自己的步骤，</text>
  <text x="84" y="512" class="t muted" font-size="14" font-weight="400" text-anchor="start">发现新的子任务可以委派给同事</text>
  <rect class="card" x="356" y="414" width="272" height="118" rx="14"/>
  <circle class="avatar" cx="392" cy="450" r="17"/>
  <text x="392" y="455.5" class="t glyph" font-size="15" font-weight="600" text-anchor="middle">验</text>
  <text x="420" y="456" class="t ink" font-size="17" font-weight="650" text-anchor="start">验收者</text>
  <text x="376" y="490" class="t muted" font-size="14" font-weight="400" text-anchor="start">由另一个模型担任，按验收标准</text>
  <text x="376" y="512" class="t muted" font-size="14" font-weight="400" text-anchor="start">检查每次结果，给出意见和证据</text>
  <rect class="card" x="648" y="414" width="272" height="118" rx="14"/>
  <circle class="avatar" cx="684" cy="450" r="17"/>
  <text x="684" y="455.5" class="t glyph" font-size="15" font-weight="600" text-anchor="middle">查</text>
  <text x="712" y="456" class="t ink" font-size="17" font-weight="650" text-anchor="start">进度检查员</text>
  <text x="668" y="490" class="t muted" font-size="14" font-weight="400" text-anchor="start">每 10 分钟看一眼长时间运行的</text>
  <text x="668" y="512" class="t muted" font-size="14" font-weight="400" text-anchor="start">步骤，只叫停真正卡住的</text>
  <rect class="card" x="940" y="414" width="272" height="118" rx="14"/>
  <circle class="avatar" cx="976" cy="450" r="17"/>
  <text x="976" y="455.5" class="t glyph" font-size="15" font-weight="600" text-anchor="middle">诊</text>
  <text x="1004" y="456" class="t ink" font-size="17" font-weight="650" text-anchor="start">诊断员</text>
  <text x="960" y="490" class="t muted" font-size="14" font-weight="400" text-anchor="start">查任务之外的障碍：缺软件、</text>
  <text x="960" y="512" class="t muted" font-size="14" font-weight="400" text-anchor="start">权限、许可证、网络，并修好环境</text>
</svg>
