<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="若水 FluidForm：像水一样随任务成形的多模型执行团队">
  <style>
    .bg { fill: #fbfaf8; } .frame { fill: none; stroke: #e8e6e1; }
    .card { fill: #ffffff; stroke: #e6e3de; } .card.lead { stroke: #1d1d1f; stroke-width: 1.6; }
    .ink { fill: #1d1d1f; } .muted { fill: #6e6e73; } .faint { fill: #a1a1a6; }
    .ring { fill: none; stroke: #1d1d1f; }
    .avatar { fill: #f1efea; } .avatar.lead { fill: #1d1d1f; } .glyph { fill: #3a3a3c; } .glyph.lead { fill: #ffffff; }
    .line { fill: none; stroke: #cfccc6; stroke-width: 1.3; } .dash { stroke-dasharray: 4 5; }
    .dot { fill: #cfccc6; } .ok { fill: #1f9d55; } .okline { stroke: #1f9d55; }
    .pill { fill: #fbfaf8; } .chip { fill: #f4f2ee; stroke: #e6e3de; } .chip.run { fill: #ffffff; stroke: #1d1d1f; }
    .group { fill: #f6f4f0; stroke: #ebe8e3; }
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f0f10; } .frame { stroke: #232326; }
      .card { fill: #18181a; stroke: #2a2a2e; } .card.lead { stroke: #ededed; }
      .ink { fill: #ededed; } .muted { fill: #a1a1a6; } .faint { fill: #6e6e73; }
      .ring { stroke: #ededed; }
      .avatar { fill: #26262a; } .avatar.lead { fill: #ededed; } .glyph { fill: #d1d1d6; } .glyph.lead { fill: #111113; }
      .line { stroke: #3a3a3f; } .dot { fill: #3a3a3f; } .ok { fill: #3ccb7f; } .okline { stroke: #3ccb7f; }
      .pill { fill: #0f0f10; } .chip { fill: #1d1d20; stroke: #2e2e33; } .chip.run { fill: #18181a; stroke: #ededed; }
      .group { fill: #141416; stroke: #222225; }
    }
  </style>
  <rect class="bg frame" x="0.5" y="0.5" width="1279" height="319" rx="20"/>
  <g class="ring" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(58.0 82.0) scale(2.4615384615384617)"><path d="M13 2.8C13 2.8 5.5 11 5.5 16.2a7.5 7.5 0 0 0 15 0C20.5 11 13 2.8 13 2.8Z" stroke-width="1.3"/><path d="M9.6 16.8a3.4 3.4 0 0 0 3.2 3" stroke-width="1.3"/></g>
  <text x="136" y="136" class="t ink" font-size="52" font-weight="650" text-anchor="start">若水</text>
  <text x="256" y="134" class="t muted" font-size="30" font-weight="500" text-anchor="start">FluidForm</text>
  <text x="64" y="204" class="t ink" font-size="22" font-weight="500" text-anchor="start">像水一样，随任务成形，把事办成。</text>
  <text x="64" y="238" class="t muted" font-size="17" font-weight="400" text-anchor="start">Like water, it takes the shape of each task, and gets it done.</text>
  <text x="64" y="282" class="mono faint" font-size="14" letter-spacing="0.5">plan → route → run → review → repair → learn</text>
  <path class="line" d="M878 104 C 923.0 104, 923.0 147, 968 147"/>
  <path class="line" d="M878 190 C 923.0 190, 923.0 147, 968 147"/>
  <path class="line" d="M1034 147 C 1079.0 147, 1079.0 104, 1124 104"/>
  <path class="line" d="M1034 147 C 1079.0 147, 1079.0 190, 1124 190"/>
  <rect class="chip" x="746" y="83" width="132" height="42" rx="21"/>
  <circle class="ok" cx="768" cy="104" r="5"/>
  <text x="784" y="109" class="t ink" font-size="15" font-weight="500" text-anchor="start">调研</text>
  <rect class="chip" x="746" y="169" width="132" height="42" rx="21"/>
  <circle class="ok" cx="768" cy="190" r="5"/>
  <text x="784" y="195" class="t ink" font-size="15" font-weight="500" text-anchor="start">看代码</text>
  <rect class="chip run" x="902" y="126" width="132" height="42" rx="21"/>
  <circle class="ok" cx="924" cy="147" r="5"/><circle cx="924" cy="147" r="9" fill="none" class="okline" stroke-opacity=".35" stroke-width="1.5"/>
  <text x="940" y="152" class="t ink" font-size="15" font-weight="500" text-anchor="start">实现</text>
  <rect class="chip" x="1058" y="83" width="132" height="42" rx="21"/>
  <circle class="dot" cx="1080" cy="104" r="4.5"/>
  <text x="1096" y="109" class="t faint" font-size="15" font-weight="500" text-anchor="start">验收</text>
  <rect class="chip" x="1058" y="169" width="132" height="42" rx="21"/>
  <circle class="dot" cx="1080" cy="190" r="4.5"/>
  <text x="1096" y="195" class="t faint" font-size="15" font-weight="500" text-anchor="start">测试</text>
  <text x="968" y="262" class="t faint" font-size="13" font-weight="400" text-anchor="middle">每一步交给够用且最便宜的模型</text>
</svg>
