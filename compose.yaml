# One service: the API, which also serves the web console (a capability package) at
# http://127.0.0.1:8000/. For working on the page itself, run `npm run dev` in frontend/.
services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./.fluidform:/app/.fluidform", "./workspaces:/app/workspaces"]
    environment:
      FLUIDFORM_WORKSPACE_ROOT: /app/workspaces
